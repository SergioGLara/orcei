<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F6E56">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Finanças da Família</title>
<style>
:root{--bg:#f4f6f5;--c:#fff;--t:#17211e;--m:#667570;--b:#dde4e1;--g:#0F6E56;--r:#B3382C;--a:#0F6E56}
@media(prefers-color-scheme:dark){:root{--bg:#121816;--c:#1b2420;--t:#e8efec;--m:#97a7a1;--b:#2c3833;--g:#5DCAA5;--r:#F09595;--a:#5DCAA5}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--t);padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 14px 6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mes{display:flex;align-items:center;gap:4px;font-weight:600;text-transform:capitalize}
#st{font-size:12px;color:var(--m);padding-top:2px;min-height:16px}
main{padding:6px 14px}
button{font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:10px;padding:8px 12px}
.sm{padding:4px 10px}
.card,.row{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row>div{min-width:0}.row b{white-space:nowrap}
small,.m{color:var(--m)}
h3{margin:18px 0 4px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g3 .card{margin:8px 0;padding:10px}.g3 b{display:block;font-size:15px}
.rec{color:var(--g)}.des{color:var(--r)}
.ck{width:28px;height:28px;border-radius:50%;padding:0;flex:none}
.ck.on{background:var(--g);color:var(--bg);border-color:var(--g)}
.l{display:flex;align-items:center;gap:10px;min-width:0}
.bar{height:8px;background:var(--b);border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:4px}
nav button{flex:1;border:0;background:none;font-size:11px;padding:8px 0;border-radius:8px}
nav button.on{color:var(--a);font-weight:600;background:var(--bg)}
nav .plus{flex:none;width:52px;background:var(--g);color:var(--bg);font-size:24px;line-height:1;border-radius:26px}
dialog{border:1px solid var(--b);border-radius:16px;background:var(--c);color:var(--t);width:min(92vw,420px);padding:16px}
dialog::backdrop{background:#0008}
label{display:block;font-size:13px;color:var(--m);margin:10px 0 0}
input,select{width:100%;font:inherit;padding:10px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);margin-top:4px}
input[type=checkbox]{width:20px;height:20px;margin:6px 0 0}
.bt{display:flex;gap:8px;margin-top:16px}.bt button{flex:1}
#ok,.pri{background:var(--g);color:var(--bg);border-color:var(--g);font-weight:600}
</style>
</head>
<body>
<header><div class="top" id="h"></div><div id="st"></div></header>
<main id="v"></main>
<nav>
<button data-t="i" onclick="go('i')">Início</button>
<button data-t="l" onclick="go('l')">Lançam.</button>
<button class="plus" onclick="fNovo()" aria-label="Novo lançamento">+</button>
<button data-t="f" onclick="go('f')">Faturas</button>
<button data-t="o" onclick="go('o')">Orçam.</button>
<button data-t="c" onclick="go('c')">Cadastros</button>
</nav>
<dialog id="dlg"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.27.0/lib/msal-browser.min.js"></script>
<script>
/* ===== CONFIGURAÇÃO: cole aqui o "ID do aplicativo (cliente)" do Microsoft Entra ===== */
const CID="20927cea-0ec6-42ff-b6ba-8f0795514cf9";
/* ======================================================================================= */
const SC=["Files.ReadWrite.All"],GR="https://graph.microsoft.com/v1.0";
const K=["pessoas","contas","cartoes","categorias","recorrencias","lancamentos","transferencias","orcamentos","faturas"];
const FR=["mensal","semanal","quinzenal","bimestral","trimestral","semestral","anual"];
let db=JSON.parse(localStorage.db||"null")||Object.fromEntries(K.map(k=>[k,[]])),
meta=JSON.parse(localStorage.meta||"{}"),mes=new Date().toISOString().slice(0,7),tab="i",app,acc,busy,tm,msg="";
const $=s=>document.querySelector(s),uid=()=>crypto.randomUUID(),now=()=>new Date().toISOString(),hoje=()=>now().slice(0,10);
const R=c=>(c/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
K.forEach(k=>db[k]=db[k]||[]);
const L=k=>db[k].filter(x=>!x.deleted_at),F1=(k,i)=>db[k].find(x=>x.id===i);
const dm=s=>s.slice(8)+"/"+s.slice(5,7);
const sum=(a,t)=>a.filter(l=>l.tipo==t).reduce((s,l)=>s+l.valor,0);
const ML=()=>L("lancamentos").filter(l=>l.vencimento.startsWith(mes));
const MT=()=>L("transferencias").filter(t=>t.data.startsWith(mes));

function save(){localStorage.db=JSON.stringify(db);localStorage.meta=JSON.stringify(meta);clearTimeout(tm);tm=setTimeout(()=>doSync(),900)}
function upsert(k,o){const i=db[k].findIndex(x=>x.id===o.id);o.updated_at=now();if(i<0){o.created_at=o.updated_at;db[k].push(o)}else Object.assign(db[k][i],o);save();render()}
const del=(k,i)=>upsert(k,{id:i,deleted_at:now()});
function merge(a,b){for(const k of K){const m=new Map(a[k].map(x=>[x.id,x]));for(const y of b[k]||[]){const x=m.get(y.id);if(!x||y.updated_at>x.updated_at)m.set(y.id,y)}a[k]=[...m.values()]}}

function add(s,f,i){const[y,m,d]=s.split("-").map(Number),dd={semanal:7,quinzenal:14}[f];
if(dd)return new Date(Date.UTC(y,m-1,d+dd*i)).toISOString().slice(0,10);
const t=m-1+{mensal:1,bimestral:2,trimestral:3,semestral:6,anual:12}[f]*i,Y=y+Math.floor(t/12),M=t%12,last=new Date(Date.UTC(Y,M+1,0)).getUTCDate();
return new Date(Date.UTC(Y,M,Math.min(d,last))).toISOString().slice(0,10)}

function saldo(c){let s=c.saldo_inicial||0;
L("lancamentos").forEach(l=>{if(l.conta_id==c.id&&l.pago_em)s+=l.tipo=="receita"?l.valor:-l.valor});
L("transferencias").forEach(t=>{if(t.efetivada_em){if(t.conta_destino_id==c.id)s+=t.valor;if(t.conta_origem_id==c.id)s-=t.valor}});L("faturas").forEach(f=>{if(f.conta_id==c.id&&f.pago_em)s-=f.valor});return s}

/* ---------- telas ---------- */
function go(t){tab=t;render()}
function mv(n){const[y,m]=mes.split("-").map(Number);mes=new Date(Date.UTC(y,m-1+n,1)).toISOString().slice(0,7);render()}
function render(){
$("#h").innerHTML=`<div class=mes><button class=sm onclick="mv(-1)" aria-label="Mês anterior">‹</button>${new Date(mes+"-02").toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}<button class=sm onclick="mv(1)" aria-label="Próximo mês">›</button></div><div>${CID&&!acc?`<button class="sm pri" onclick="app&&app.loginRedirect({scopes:SC})">Entrar</button> `:""}<button class=sm onclick="fCfg()" aria-label="Configurações">⚙</button></div>`;
$("#st").textContent=msg||(CID?"":"Modo local: dados só neste aparelho");
$("#v").innerHTML={i:vI,l:vL,o:vO,c:vC,f:vF}[tab]();
document.querySelectorAll("nav button[data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t==tab))}

function vI(){const m=ML(),mt=m.filter(l=>l.pago_em),r=sum(m,"receita"),d=sum(m,"despesa");
const cs=L("contas"),ks=L("cartoes");
return`<div class=g3><div class=card><small>Receitas</small><b class=rec>${R(r)}</b></div><div class=card><small>Despesas</small><b class=des>${R(d)}</b></div><div class=card><small>Resultado</small><b>${R(r-d)}</b></div></div>
<small>Previsto + realizado do mês. Já pago/recebido: ${R(sum(mt,"receita")-sum(mt,"despesa"))}</small>
${gCat()}<h3>Contas</h3>${cs.map(c=>`<div class=row><span>${esc(c.nome)}</span><b>${R(saldo(c))}</b></div>`).join("")||'<p class=m>Nenhuma conta ainda. Vá em Cadastros.</p>'}
${fatAb()}`}

/* gráfico de colunas: despesas do mês por categoria (subcategorias somadas à principal) */
const kc=v=>{const n=v/100;return n>=1000?(n/1000).toFixed(1).replace(".",",")+" mil":Math.round(n)+""};
function gCat(){const t={};
ML().filter(l=>l.tipo=="despesa").forEach(l=>{const c=F1("categorias",l.categoria_id),top=c?(c.pai_id&&F1("categorias",c.pai_id)||c):null,id=top?top.id:"-";t[id]=t[id]||{id,n:top?top.nome:"Sem categoria",v:0};t[id].v+=l.valor});
let a=Object.values(t).sort((x,y)=>y.v-x.v);if(!a.length)return"";
if(a.length>7)a=[...a.slice(0,6),{n:"Outras",v:a.slice(6).reduce((s,x)=>s+x.v,0)}];
const W=340,H=210,B=62,T=22,mx=Math.max(...a.map(x=>x.v)),gap=(W-20)/a.length,bw=Math.min(36,gap-8);
const bars=a.map((x,i)=>{const h=Math.max(2,(H-B-T)*x.v/mx),cx=10+gap*i+gap/2,y=H-B-h,o=L("orcamentos").find(z=>z.categoria_id==x.id&&z.mes_ano==mes),over=o&&x.v>o.limite;
return`<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${h}" rx="4" fill="${over?"var(--r)":"var(--g)"}"/><text x="${cx}" y="${y-5}" text-anchor="middle" font-size="10" fill="currentColor">${kc(x.v)}</text><text transform="translate(${cx},${H-B+12}) rotate(-40)" text-anchor="end" font-size="10" fill="currentColor">${esc(x.n.length>11?x.n.slice(0,10)+"…":x.n)}</text>`}).join("");
return`<h3>Gastos por categoria</h3><div class=card><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico de colunas dos gastos por categoria no mês"><line x1="10" x2="${W-10}" y1="${H-B}" y2="${H-B}" stroke="var(--b)"/>${bars}</svg><small>Despesas do mês em R$, somando subcategorias. Vermelho: acima do limite do orçamento.</small></div>`}

function vL(){const it=[...ML().map(o=>({k:"l",o,d:o.vencimento})),...MT().map(o=>({k:"t",o,d:o.data}))].sort((a,b)=>a.d<b.d?-1:1);
return it.map(({k,o,d})=>{
if(k=="t"){const a=F1("contas",o.conta_origem_id),b=F1("contas",o.conta_destino_id);
return`<div class=row><div class=l><button class="ck ${o.efetivada_em?"on":""}" onclick="tg('t','${o.id}')">✓</button><div onclick="fTr('${o.id}')"><div>${esc(o.descricao||"Transferência")}</div><small>${dm(d)} · ${esc(a?.nome)} → ${esc(b?.nome)} ✎</small></div></div><b>${R(o.valor)}</b></div>`}
const c=F1("categorias",o.categoria_id),w=F1("contas",o.conta_id)||F1("cartoes",o.cartao_id),cd=o.cartao_id&&F1("cartoes",o.cartao_id),fa=cd&&fat(cd,o.vencimento),pg=cd?L("faturas").some(f=>f.cartao_id==cd.id&&f.ref==fa.ref):o.pago_em;
return`<div class=row><div class=l><button class="ck ${pg?"on":""}" onclick="${cd?`irFat('${o.id}')`:`tg('l','${o.id}')`}">✓</button><div onclick="fLanc('${o.tipo}','${o.id}')"><div>${esc(o.descricao)}</div><small>${dm(d)} · ${esc(c?.nome||"Sem categoria")} · ${esc(w?.nome)}${cd?" · fatura vence "+dm(fa.venc):""} ✎</small></div></div><b class="${o.tipo=="receita"?"rec":"des"}">${o.tipo=="receita"?"":"−"}${R(o.valor)}</b></div>`}).join("")||'<p class=m>Nada neste mês. Toque em + para lançar.</p>'}

function vO(){const cs=L("categorias").filter(c=>c.tipo=="despesa"&&!c.pai_id);
return cs.map(c=>{const ids=[c.id,...L("categorias").filter(x=>x.pai_id==c.id).map(x=>x.id)];
const g=ML().filter(l=>l.tipo=="despesa"&&ids.includes(l.categoria_id)).reduce((s,l)=>s+l.valor,0);
const o=L("orcamentos").find(x=>x.categoria_id==c.id&&x.mes_ano==mes),p=o&&o.limite?Math.min(100,g/o.limite*100):0;
return`<div class=card onclick="fOrc('${c.id}')"><div class=row style="border:0;padding:0;margin:0;background:none"><span>${esc(c.nome)}</span><b>${R(g)}${o?" / "+R(o.limite):""}</b></div>${o?`<div class=bar><i style="width:${p}%;${g>o.limite?"background:var(--r)":""}"></i></div>`:"<small>Toque para definir o limite do mês</small>"}</div>`}).join("")||'<p class=m>Cadastre categorias de despesa primeiro (aba Cadastros).</p>'}

function vC(){const row=(f,id,a,b)=>`<div class=row onclick="${f}('${id}')"><span>${a}</span><small>${b||""} ✎</small></div>`;
const cats=L("categorias"),top=cats.filter(c=>!c.pai_id);
return`<h3>Contas <button class=sm onclick="fConta()">+ Nova</button></h3>${L("contas").map(c=>row("fConta",c.id,esc(c.nome),c.tipo)).join("")}
<h3>Cartões <button class=sm onclick="fCartao()">+ Novo</button></h3>${L("cartoes").map(c=>row("fCartao",c.id,esc(c.nome),"fecha dia "+c.dia_fechamento+" · vence dia "+c.dia_vencimento)).join("")}
<h3>Categorias <button class=sm onclick="fCat()">+ Nova</button></h3>${top.map(c=>row("fCat",c.id,esc(c.nome),c.tipo)+cats.filter(x=>x.pai_id==c.id).map(x=>row("fCat",x.id,"&emsp;↳ "+esc(x.nome),x.tipo)).join("")).join("")}`}

/* ---------- faturas do cartão ---------- */
/* Compra até o dia do fechamento (inclusive) entra na fatura que fecha naquele mês; depois, na do mês seguinte. */
function fat(k,d){const[y,m,dia]=d.split("-").map(Number);
const mk=(Y,M,D)=>{const t=new Date(Date.UTC(Y,M-1,1));Y=t.getUTCFullYear();M=t.getUTCMonth()+1;const u=new Date(Date.UTC(Y,M,0)).getUTCDate();return Y+"-"+String(M).padStart(2,"0")+"-"+String(Math.min(D,u)).padStart(2,"0")};
const fm=dia<=k.dia_fechamento?m:m+1,fech=mk(y,fm,k.dia_fechamento),venc=mk(y,k.dia_vencimento>k.dia_fechamento?fm:fm+1,k.dia_vencimento);
return{ref:fech.slice(0,7),fech,venc}}
const sh=(ref,n)=>{const[y,m]=ref.split("-").map(Number);return new Date(Date.UTC(y,m-1+n,1)).toISOString().slice(0,7)};
function fatD(k,ref){const itens=L("lancamentos").filter(l=>l.cartao_id==k.id&&fat(k,l.vencimento).ref==ref).sort((a,b)=>a.vencimento<b.vencimento?-1:1),f=fat(k,ref+"-01");
return{ref,fech:f.fech,venc:f.venc,itens,total:itens.reduce((s,l)=>s+l.valor,0),pg:L("faturas").find(x=>x.cartao_id==k.id&&x.ref==ref)}}
function fatAb(){const o=[];L("cartoes").forEach(k=>{const r0=fat(k,hoje()).ref;[sh(r0,-1),r0].forEach(ref=>{const d=fatD(k,ref);if(d.total&&!d.pg)o.push({k,d})})});
return o.length?"<h3>Faturas em aberto</h3>"+o.map(({k,d})=>`<div class=row onclick="irMes('${d.venc.slice(0,7)}')"><div><div>${esc(k.nome)}</div><small>${hoje()>d.fech?"Fechada":"Aberta"} · vence ${dm(d.venc)}</small></div><b>${R(d.total)}</b></div>`).join(""):""}
function irMes(m){mes=m;go("f")}
function irFat(id){const l=F1("lancamentos",id);irMes(fat(F1("cartoes",l.cartao_id),l.vencimento).venc.slice(0,7))}
function vF(){const[y,m]=mes.split("-").map(Number);
return"<small>Faturas que vencem neste mês</small>"+(L("cartoes").map(k=>{const ref=new Date(Date.UTC(y,m-1-(k.dia_vencimento>k.dia_fechamento?0:1),1)).toISOString().slice(0,7),d=fatD(k,ref),st=d.pg?"Paga em "+dm(d.pg.pago_em):(hoje()>d.fech?"Fechada":"Aberta");
return`<div class=card><div class=row style="border:0;padding:0;margin:0;background:none"><b>${esc(k.nome)}</b><b>${R(d.total)}</b></div><small>${st} · fecha ${dm(d.fech)} · vence ${dm(d.venc)}</small>${d.itens.map(l=>`<div class=row onclick="fLanc('despesa','${l.id}')"><div><div>${esc(l.descricao)}</div><small>${dm(l.vencimento)} ✎</small></div><b class=des>${R(l.valor)}</b></div>`).join("")||"<p class=m>Sem compras nesta fatura.</p>"}<div class=bt>${d.pg?`<button onclick="desfPag('${d.pg.id}')">Desfazer pagamento</button>`:`<button class=pri onclick="fPag('${k.id}','${ref}')">Pagar fatura</button>`}</div></div>`}).join("")||'<p class=m>Cadastre um cartão (aba Cadastros).</p>')}
function fPag(kid,ref){const k=F1("cartoes",kid),d=fatD(k,ref),cs=L("contas");if(!cs.length){alert("Cadastre uma conta antes.");return}
form("Pagar fatura "+esc(k.nome),[{n:"conta_id",l:"Pagar com a conta",o:cs.map(c=>[c.id,c.nome])},{n:"valor",l:"Valor pago (R$)",$:1,r:1},{n:"pago_em",l:"Data do pagamento",t:"date",r:1}],{conta_id:k.conta_pgto_id||cs[0].id,valor:d.total,pago_em:hoje()},o=>upsert("faturas",{id:uid(),cartao_id:kid,ref,conta_id:o.conta_id,valor:o.valor,pago_em:o.pago_em}))}
function desfPag(i){if(confirm("Desfazer o pagamento desta fatura?"))del("faturas",i)}

function tg(k,i){const t=k=="l"?"lancamentos":"transferencias",f=k=="l"?"pago_em":"efetivada_em";upsert(t,{id:i,[f]:F1(t,i)[f]?null:hoje()})}

/* ---------- formulários ---------- */
function form(title,F,v,ok,rm){const d=$("#dlg");
d.innerHTML=`<form method=dialog><h3 style="margin-top:0">${title}</h3>`+F.map(f=>`<label>${f.l}${f.o?`<select name=${f.n}>${f.o.map(([a,b])=>`<option value="${esc(a)}" ${a==v[f.n]?"selected":""}>${esc(b)}</option>`).join("")}</select>`:f.t=="checkbox"?`<br><input type=checkbox name=${f.n} ${v[f.n]?"checked":""}>`:`<input name=${f.n} type="${f.$?"number":f.t||"text"}" ${f.$?'step="0.01" inputmode="decimal"':""} ${f.t=="number"?'inputmode="numeric"':""} value="${esc(f.$&&v[f.n]!=null?v[f.n]/100:v[f.n])}" ${f.r?"required":""}>`}</label>`).join("")+`<div class=bt><button value=x formnovalidate>Cancelar</button>${rm?'<button type=button id=rm>Excluir</button>':""}<button id=ok>Salvar</button></div></form>`;
d.querySelector("form").onsubmit=e=>{if(e.submitter?.id!="ok")return;const fd=new FormData(e.target),o={};
F.forEach(f=>{let x=fd.get(f.n);if(f.t=="checkbox")x=x=="on";else if(f.$)x=Math.round(parseFloat(x||0)*100);else if(f.t=="number")x=x===""?null:+x;else if(x==="")x=null;o[f.n]=x});
if(ok(o)===false)e.preventDefault()};
if(rm)d.querySelector("#rm").onclick=()=>{if(confirm("Excluir este item?")){rm();d.close()}};
d.showModal()}

const nome=(c,all)=>{const p=c.pai_id&&F1("categorias",c.pai_id);return p?p.nome+" › "+c.nome:c.nome};
function fNovo(){const d=$("#dlg");d.innerHTML=`<h3 style="margin-top:0">Novo lançamento</h3><div class=bt style="flex-direction:column"><button onclick="fLanc('despesa')">Despesa</button><button onclick="fLanc('receita')">Receita</button><button onclick="fTr()">Transferência entre contas</button><button onclick="$('#dlg').close()">Cancelar</button></div>`;d.showModal()}

function fLanc(tipo,i){const v=i?{...F1("lancamentos",i)}:{vencimento:hoje()};if(i)v.pago=!!v.pago_em;
const cs=L("contas"),ks=tipo=="despesa"?L("cartoes"):[];
if(!cs.length){$("#dlg").close();alert("Cadastre uma conta antes (aba Cadastros).");return}
v.origem=v.cartao_id?"k:"+v.cartao_id:"c:"+(v.conta_id||cs[0].id);
const F=[{n:"descricao",l:"Descrição",r:1},{n:"valor",l:"Valor (R$)",$:1,r:1},{n:"vencimento",l:"Data (da compra, se for no cartão)",t:"date",r:1},
{n:"origem",l:tipo=="receita"?"Entra na conta":"Sai da conta/cartão",o:[...cs.map(c=>["c:"+c.id,c.nome]),...ks.map(c=>["k:"+c.id,"Cartão "+c.nome])]},
{n:"categoria_id",l:"Categoria",o:[["","Sem categoria"],...L("categorias").filter(c=>c.tipo==tipo).map(c=>[c.id,nome(c)])]},
{n:"pago",l:tipo=="receita"?"Já recebido":"Já pago (não vale p/ cartão)",t:"checkbox"}];
if(i&&v.recorrencia_id)F.push({n:"ap",l:"Aplicar a",o:[["","Só este lançamento"],["fut","Este e os próximos da série"]]});
if(!i)F.push({n:"rec",l:"Repetir",o:[["","Não repetir"],...FR.map(f=>[f,f])]},{n:"qtd",l:"Quantas vezes (se repetir)",t:"number"});
form((i?"Editar ":"Nova ")+tipo,F,v,o=>{const[t,x]=o.origem.split(":");if(t=="k")o.pago=false;const b={descricao:o.descricao,valor:o.valor,vencimento:o.vencimento,tipo,categoria_id:o.categoria_id,conta_id:t=="c"?x:null,cartao_id:t=="k"?x:null,pessoa_id:meta.eu||null};
if(i){(o.ap=="fut"?serie(v,1):[v]).forEach(x=>upsert("lancamentos",{...b,id:x.id,vencimento:x.id==i?o.vencimento:x.vencimento,pago_em:x.id==i?(o.pago?(v.pago_em||hoje()):null):x.pago_em}));return}
let n=1,rid=null;if(o.rec){n=o.qtd||12;rid=uid();upsert("recorrencias",{id:rid,frequencia:o.rec,inicio:o.vencimento,qtd_parcelas:n})}
for(let k=0;k<n;k++)upsert("lancamentos",{...b,id:uid(),recorrencia_id:rid,parcela_num:o.rec?k+1:null,vencimento:add(o.vencimento,o.rec||"mensal",k),pago_em:k==0&&o.pago?hoje():null})},
i?()=>{const s=v.recorrencia_id&&confirm("Este lançamento se repete.\nOK = excluir também os próximos da série.\nCancelar = excluir só este.");serie(v,s).forEach(x=>del("lancamentos",x.id))}:0)}

const serie=(v,s)=>s?L("lancamentos").filter(x=>x.recorrencia_id==v.recorrencia_id&&x.vencimento>=v.vencimento):[v];
function emUso(k,i){const n=(a,f)=>L(a).filter(f).length;
if(k=="contas")return n("lancamentos",x=>x.conta_id==i)+n("transferencias",x=>x.conta_origem_id==i||x.conta_destino_id==i)+n("cartoes",x=>x.conta_pgto_id==i)+n("faturas",x=>x.conta_id==i);
if(k=="cartoes")return n("lancamentos",x=>x.cartao_id==i)+n("faturas",x=>x.cartao_id==i);
return n("lancamentos",x=>x.categoria_id==i)+n("categorias",x=>x.pai_id==i)}
function delc(k,i){const n=emUso(k,i);if(n){alert("Não dá para excluir: há "+n+" item(ns) usando este cadastro. Edite ou exclua esses itens antes.");return}del(k,i)}
function fTr(i){const cs=L("contas");if(cs.length<2){$("#dlg").close();alert("Cadastre pelo menos duas contas.");return}
const v=i?{...F1("transferencias",i)}:{data:hoje(),conta_origem_id:cs[0].id,conta_destino_id:cs[1].id};if(i)v.ef=!!v.efetivada_em;
const op=cs.map(c=>[c.id,c.nome]);
form(i?"Editar transferência":"Nova transferência",[{n:"descricao",l:"Descrição"},{n:"valor",l:"Valor (R$)",$:1,r:1},{n:"data",l:"Data",t:"date",r:1},{n:"conta_origem_id",l:"De",o:op},{n:"conta_destino_id",l:"Para",o:op},{n:"ef",l:"Já realizada",t:"checkbox"}],v,
o=>{if(o.conta_origem_id==o.conta_destino_id){alert("Escolha contas diferentes.");return false}
upsert("transferencias",{id:i||uid(),descricao:o.descricao,valor:o.valor,data:o.data,conta_origem_id:o.conta_origem_id,conta_destino_id:o.conta_destino_id,pessoa_id:meta.eu||null,efetivada_em:o.ef?(v.efetivada_em||hoje()):null})},
i?()=>del("transferencias",i):0)}

function fConta(i){const v=i?F1("contas",i):{tipo:"corrente"};
form(i?"Editar conta":"Nova conta",[{n:"nome",l:"Nome",r:1},{n:"tipo",l:"Tipo",o:["corrente","poupanca","dinheiro","investimento","outra"].map(x=>[x,x])},{n:"saldo_inicial",l:"Saldo inicial (R$)",$:1}],v,
o=>upsert("contas",{id:i||uid(),...o,ativa:1}),i?()=>delc("contas",i):0)}

function fCartao(i){const v=i?F1("cartoes",i):{dia_fechamento:1,dia_vencimento:10};
form(i?"Editar cartão":"Novo cartão",[{n:"nome",l:"Nome",r:1},{n:"limite",l:"Limite (R$)",$:1},{n:"dia_fechamento",l:"Dia do fechamento",t:"number",r:1},{n:"dia_vencimento",l:"Dia do vencimento",t:"number",r:1},{n:"conta_pgto_id",l:"Paga a fatura com",o:[["","—"],...L("contas").map(c=>[c.id,c.nome])]}],v,
o=>upsert("cartoes",{id:i||uid(),...o,ativo:1}),i?()=>delc("cartoes",i):0)}

function fCat(i){const v=i?F1("categorias",i):{tipo:"despesa"};
form(i?"Editar categoria":"Nova categoria",[{n:"nome",l:"Nome",r:1},{n:"tipo",l:"Tipo",o:[["despesa","Despesa"],["receita","Receita"]]},{n:"pai_id",l:"Subcategoria de",o:[["","— (categoria principal)"],...L("categorias").filter(c=>!c.pai_id&&c.id!=i).map(c=>[c.id,c.nome])]}],v,
o=>upsert("categorias",{id:i||uid(),...o}),i?()=>delc("categorias",i):0)}

function fOrc(cid){const o=L("orcamentos").find(x=>x.categoria_id==cid&&x.mes_ano==mes);
form("Limite de "+esc(F1("categorias",cid).nome)+" em "+mes.slice(5)+"/"+mes.slice(0,4),[{n:"limite",l:"Limite do mês (R$)",$:1,r:1}],o||{},
x=>upsert("orcamentos",{id:o?.id||uid(),categoria_id:cid,mes_ano:mes,limite:x.limite}),o?()=>del("orcamentos",o.id):0)}

function fCfg(){const p=meta.eu&&F1("pessoas",meta.eu);
form("Configurações",[{n:"nome",l:"Seu nome"},{n:"codigo",l:CID?"Código de compartilhamento (cole o do seu cônjuge, se ele já criou)":"OneDrive desativado (falta o CID no código)"}],{nome:p?.nome,codigo:meta.t},
o=>{if(o.nome){meta.eu=meta.eu||uid();upsert("pessoas",{id:meta.eu,nome:o.nome})}
if(o.codigo&&o.codigo!=meta.t){meta.t=o.codigo;save()}});
if(acc)$("#dlg .bt").insertAdjacentHTML("beforebegin",`<p><small>Conectado como ${esc(acc.username)}. Código para compartilhar com seu cônjuge (depois de compartilhar a pasta FinancasFamilia no OneDrive):</small><br><code style="word-break:break-all">${esc(meta.t||"(aparece após a primeira sincronização)")}</code></p><button type=button onclick="app.logoutRedirect()">Sair da conta Microsoft</button>`)}

/* ---------- OneDrive (Microsoft Graph) ---------- */
async function tok(){try{return(await app.acquireTokenSilent({scopes:SC,account:acc})).accessToken}catch(e){app.acquireTokenRedirect({scopes:SC})}}
function st(t){msg=t;const e=$("#st");if(e)e.textContent=t}
async function doSync(n=0){if(!acc||busy)return;busy=1;st("Sincronizando…");
try{const H={Authorization:"Bearer "+await tok()};
if(!meta.t){const u=`${GR}/me/drive/root:/FinancasFamilia/dados.json`;let r=await fetch(u,{headers:H});
if(!r.ok)r=await fetch(u+":/content",{method:"PUT",headers:H,body:JSON.stringify(db)});
const j=await r.json();meta.t=j.parentReference.driveId+"|"+j.id}
const[d,i]=meta.t.split("|"),b=`${GR}/drives/${d}/items/${i}`;
const m=await fetch(b,{headers:H});if(!m.ok)throw Error("arquivo inacessível ("+m.status+")");const et=(await m.json()).eTag;
const c=await fetch(b+"/content",{headers:H});if(c.ok){const t=await c.text();if(t.trim())merge(db,JSON.parse(t))}
const p=await fetch(b+"/content",{method:"PUT",headers:{...H,"If-Match":et,"Content-Type":"application/json"},body:JSON.stringify(db)});
if(p.status==412&&n<3){busy=0;return doSync(n+1)}
if(!p.ok)throw Error("falha ao salvar ("+p.status+")");
localStorage.db=JSON.stringify(db);localStorage.meta=JSON.stringify(meta);
st("Sincronizado às "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}));render()}
catch(e){st("Sem sincronizar: "+e.message)}busy=0}

async function init(){if(!CID)return;
try{app=new msal.PublicClientApplication({auth:{clientId:CID,authority:"https://login.microsoftonline.com/consumers",redirectUri:location.origin+location.pathname},cache:{cacheLocation:"localStorage"}});
await app.initialize();const r=await app.handleRedirectPromise();acc=r?.account||app.getAllAccounts()[0];render();if(acc)doSync()}
catch(e){st("Login indisponível: "+e.message)}}
render();init();
</script>
